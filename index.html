<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="hero-logo-text">Header Logo</h1>
            <div class="links">
                <a href="#" class="hero-secondary-text">header link one</a>
                <a href="#" class="hero-secondary-text">header link two</a>
                <a href="#" class="hero-secondary-text">header link three</a>
            </div>
        </div>
        <div class="container header-bottom">
            <div class="header-bottom-text">
                <h1 class="hero-main-text">This website is awesome!</h1>
                <p class="hero-secondary-text">This website has some subtext that goes here under the main title. It's a smaller font and the color is lower contrast.</p>
                <button class="hero-secondary-text sign-up-button">Sign up</button>
            </div>
            <div class="header-bottom-placeholder">
                <p class="hero-secondary-text">This is a placeholder for an image.</p>
            </div>
        </div>
    </header>
</body>
</html>
